services:
  postgres:
    image: postgres:16-alpine
    container_name: monprefac-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: monprefac
      POSTGRES_PASSWORD: monprefac_dev
      POSTGRES_DB: monprefac
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: